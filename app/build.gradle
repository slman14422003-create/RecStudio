import java.util.Properties

plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def signStore = System.getenv('SIGNING_STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def signStorePass = System.getenv('SIGNING_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def signAlias = System.getenv('SIGNING_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def signKeyPass = System.getenv('SIGNING_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
def hasSigning = signStore && signStorePass && signAlias && signKeyPass
if (System.getenv('REQUIRE_RELEASE_SIGNING') == 'true' && !hasSigning) {
    throw new GradleException('Release signing is required but the signing variables are missing')
}

def sherpaVersion = '1.13.4'
def sherpaAar = file("libs/sherpa-onnx-${sherpaVersion}.aar")

tasks.register('fetchSherpa') {
    outputs.file(sherpaAar)
    doLast {
        if (!sherpaAar.exists() || sherpaAar.length() == 0) {
            sherpaAar.parentFile.mkdirs()
            def part = new File(sherpaAar.parentFile, sherpaAar.name + '.part')
            def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar"
            new URL(url).withInputStream { i -> part.withOutputStream { o -> o << i } }
            if (!part.renameTo(sherpaAar)) throw new GradleException('Could not store the sherpa-onnx archive')
        }
    }
}

android {
    namespace = 'com.rec.app'
    compileSdk = 36

    defaultConfig {
        applicationId = "app.rec.studio"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
        resourceConfigurations += ["ar", "en"]
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile = file(signStore)
                storePassword = signStorePass
                keyAlias = signAlias
                keyPassword = signKeyPass
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so', '**/libonnxruntime.so']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation files(sherpaAar).builtBy('fetchSherpa')
}
